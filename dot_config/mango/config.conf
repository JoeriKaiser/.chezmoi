# MangoWM + Dux Modular Shell (DMS) configuration
# Hardware-specific outputs, colors, layout, cursor, input, and window rules are
# managed by DMS in ./dms/*.conf. Keybinds live directly here to avoid conflicts.

# === Environment ===
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_QPA_PLATFORMTHEME_QT6,gtk3

# === Input & Focus ===
sloppy_focus=1
warp_cursor=1
numlock_on=1
tap_to_click=1
trackpad_natural_scrolling=1

# === Animations ===
animations=1
animation_duration_move=200
animation_duration_open=180
animation_duration_close=150
animation_duration_tag=180
animation_duration_workspace_overview_open=150
animation_duration_workspace_overview_close=150
animation_duration_workspace_overview_move=200
animation_curve_open=0.2,1.0,0.2,1.0
animation_curve_move=0.2,1.0,0.2,1.0
animation_curve_tag=0.2,1.0,0.2,1.0
animation_curve_close=0.2,1.0,0.2,1.0

# === Scroller & Default Layout ===
scroller_structs=0
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667
monocle_tab_mode=0
deck_tab_mode=0

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# === DMS Managed Fragments ===
source=./dms/colors.conf
source=./dms/layout.conf
source=./dms/cursor.conf
source=./dms/input.conf
source=./dms/outputs.conf
source=./dms/windowrules.conf

# === DMS Purple Theme (fills in Mango colors that dms/colors.conf leaves at brown/green defaults) ===
root_color=0x141218ff
border_color=0x49454eff
focus_color=0xd0bcffff
maximized_screen_color=0x6750a4ff
urgent_color=0xf2b8b5ff
drop_color=0xd0bcff55
split_color=0xbca5f2ff
scratchpad_color=0x6750a4ff
global_color=0x937fcbff
overlay_color=0x4f378bff

# === Window Rules ===
window_rule=is_floating:1,app_id:^firefox$,title:^Picture-in-Picture$

# === Application Launchers ===
# Open Terminal
bind=SUPER,t,spawn,ghostty
# Open Terminal
bind=SUPER,Return,spawn,ghostty
# App Launcher (vicinae)
bind=SUPER,d,spawn,vicinae toggle
# DMS Spotlight
bind=SUPER,space,spawn,dms ipc call spotlight toggle
# DMS Spotlight Bar
bind=ALT,space,spawn,dms ipc call spotlight-bar toggle

# === DMS Controls ===
# Toggle DMS Bar
bind=SUPER,b,spawn,dms ipc call bar toggle index 0
# Clipboard Manager
bind=SUPER,v,spawn,dms ipc call clipboard toggle
# Media
bind=SUPER,m,spawn,dms ipc call dash toggle media
# Settings
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
# Notepad
bind=SUPER,n,spawn,dms ipc call notepad toggle
# Notepad: Expand
bind=SUPER+SHIFT,n,spawn,dms ipc call notepad toggleExpand
# Notification Center
bind=SUPER+CTRL,n,spawn,dms ipc call notifications toggle
# Browse Wallpapers
bind=SUPER,y,spawn,dms ipc call dash toggle wallpaper
# Power Menu
bind=SUPER,x,spawn,dms ipc call powermenu toggle
# Cycle Display Profile
bind=SUPER,p,spawn,dms ipc outputs cycleProfile
# Control Center
bind=SUPER,a,spawn,dms ipc call control-center toggle
# Color Picker
bind=SUPER+SHIFT,c,spawn,dms ipc call color-picker toggle
# Night Mode
bind=SUPER+ALT,n,spawn,dms ipc call night toggle
# Idle Inhibit
bind=SUPER+ALT,i,spawn,dms ipc call inhibit toggle
# Create Window Rule
bind=SUPER+SHIFT,w,spawn,dms ipc call window-rules toggle
# Keyboard Shortcuts
bind=SUPER+SHIFT,slash,spawn,dms ipc call keybinds toggle mangowc
# Lock Screen
bind=SUPER+ALT,l,spawn,dms ipc call lock lock
# Task Manager
bind=CTRL+ALT,Delete,spawn,dms ipc call processlist focusOrToggle
# Task Manager
bind=CTRL+ALT,m,spawn,dms ipc call processlist focusOrToggle

# === OSM Meh (Ctrl+Shift+Alt) DMS Binds ===
# Toggle DMS Bar
bind=CTRL+SHIFT+ALT,b,spawn,dms ipc call bar toggle index 0
# Lock Screen
bind=CTRL+SHIFT+ALT,l,spawn,dms ipc call lock lock
# Power Menu
bind=CTRL+SHIFT+ALT,p,spawn,dms ipc call powermenu toggle
# Control Center
bind=CTRL+SHIFT+ALT,a,spawn,dms ipc call control-center toggle
# DMS Settings
bind=CTRL+SHIFT+ALT,s,spawn,dms ipc call settings focusOrToggle
# Clipboard Manager
bind=CTRL+SHIFT+ALT,c,spawn,dms ipc call clipboard toggle
# Notification Center
bind=CTRL+SHIFT+ALT,n,spawn,dms ipc call notifications toggle
# Screenshot: Region
bind=CTRL+SHIFT+ALT,f,spawn,dms screenshot
# Keyboard Shortcuts
bind=CTRL+SHIFT+ALT,slash,spawn,dms ipc call keybinds toggle mangowc

# === Screenshots ===
# Screenshot: Interactive
bind=none,Print,spawn,dms screenshot
# Screenshot: Full Screen
bind=CTRL,Print,spawn,dms screenshot full
# Screenshot: Window
bind=ALT,Print,spawn,dms screenshot window

# === Audio & Brightness Controls ===
bindl=none,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bindl=none,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bindl=none,XF86AudioMute,spawn,dms ipc call audio mute
bindl=none,XF86AudioMicMute,spawn,dms ipc call audio micmute
bindl=none,XF86AudioPlay,spawn,dms ipc call mpris playPause
bindsl=none,XF86AudioPause,spawn,dms ipc call mpris playPause
bindl=none,XF86AudioPrev,spawn,dms ipc call mpris previous
bindl=none,XF86AudioNext,spawn,dms ipc call mpris next
bindl=CTRL,XF86AudioRaiseVolume,spawn,dms ipc call mpris increment 3
bindl=CTRL,XF86AudioLowerVolume,spawn,dms ipc call mpris decrement 3
bindl=none,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5 ""
bindl=none,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5 ""

# === Window Management ===
# Close Window
bind=SUPER,q,killclient,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+ALT,f,togglefakefullscreen,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER+SHIFT,t,togglefloating,
# Show Window on All Tags
bind=SUPER,g,toggleglobal,
# Keep Window on Top
bind=SUPER+CTRL,o,toggleoverlay,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized,
bind=SUPER,s,toggle_scratchpad,
bind=SUPER,o,toggleoverview
bind=ALT,Tab,toggleoverview
# Jump to Window
bind=SUPER+SHIFT,o,togglejump,
bind=SUPER,r,reload_config
# Power Menu
bind=SUPER+SHIFT,e,spawn,dms ipc call powermenu toggle

# === Window Switchers ===
# Active Monitor Overcircle
bind=SUPER,Tab,overcircle,next
# All Monitors Thumbnail Switcher
bind=SUPER+SHIFT,Tab,switcher,all_next

# === Focus Navigation ===
bind=SUPER,Left,focusdir,left
bind=SUPER,H,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,L,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,K,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,J,focusdir,down

# === Window Movement ===
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,L,move_client,right
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,J,move_client,down

# === Window Sizing ===
bind=SUPER,minus,resizewin,-50,+0
bind=SUPER,equal,resizewin,+50,+0
bind=SUPER+CTRL,minus,resizewin,+0,-50
bind=SUPER+CTRL,equal,resizewin,+0,+50
bind=SUPER+ALT+SHIFT,Left,movewin,-50,+0
bind=SUPER+ALT+SHIFT,Right,movewin,+50,+0
bind=SUPER+ALT+SHIFT,Up,movewin,+0,-50
bind=SUPER+ALT+SHIFT,Down,movewin,+0,+50

# === Monitor Navigation ===
# Physical F13 (XF86Tools) & F14 (XF86Launch5)
# Focus Other Monitor
bind=none,XF86Tools,focusmon,next
# Move Window to Other Monitor
bind=SHIFT,XF86Tools,tagmon,next,0
# Toggle Overview
bind=none,XF86Launch5,toggleoverview
# Move Window to Left/Right Monitor (OSM Meh + Left/Right)
bind=CTRL+SHIFT+ALT,Left,tagmon,left,0
bind=CTRL+SHIFT+ALT,Right,tagmon,right,0
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL,H,focusmon,left
bind=SUPER+CTRL,J,focusmon,down
bind=SUPER+CTRL,K,focusmon,up
bind=SUPER+CTRL,L,focusmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left,0
bind=SUPER+CTRL+SHIFT,Right,tagmon,right,0
bind=SUPER+CTRL+SHIFT,Up,tagmon,up,0
bind=SUPER+CTRL+SHIFT,Down,tagmon,down,0

# === Layout ===
# Cycle Layout
bind=SUPER+ALT,j,switch_layout
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,g,togglegaps
bind=SUPER+CTRL,f,set_proportion,1.0
bind=SUPER+SHIFT,r,switch_proportion_preset,
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down
# Toggle Split Direction
bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction

# === Tags ===
bind=SUPER+ALT,Left,viewtoleft,0
bind=SUPER+ALT,Right,viewtoright,0
bind=SUPER,Page_Up,viewtoleft_have_client,0
bind=SUPER,Page_Down,viewtoright_have_client,0
bind=SUPER+CTRL,Up,tagtoleft,0
bind=SUPER+CTRL,Down,tagtoright,0
bind=SUPER+CTRL,I,tagtoleft,0
bind=SUPER+CTRL,U,tagtoright,0

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# === Mouse & Touchpad ===
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
